services:
  backend:
    build: ./backend
    ports: ["127.0.0.1:8080:8080"]
    environment:
      RUNEVAULT_DEVICE_SECRET: ${RUNEVAULT_DEVICE_SECRET:?Copy .env.example to .env first}
  frontend:
    image: nginx:stable-alpine
    ports: ["127.0.0.1:4200:80"]
    volumes: ["./frontend:/usr/share/nginx/html:ro"]
