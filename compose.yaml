name: runevault
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: runevault
      POSTGRES_USER: runevault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-only-change-before-deploy}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runevault -d runevault"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    ports: ["127.0.0.1:8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: auth
      AUTH0_ISSUER_URI: ${AUTH0_ISSUER_URI:?Set the Auth0 tenant issuer URI in .env}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://api.runevault}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/runevault
      SPRING_DATASOURCE_USERNAME: runevault
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-only-change-before-deploy}
      RUNEVAULT_BRIDGE_TOKEN: ${RUNEVAULT_BRIDGE_TOKEN:?Set a strong bridge token in .env}
      RUNEVAULT_WS_ALLOWED_ORIGINS: ${RUNEVAULT_WS_ALLOWED_ORIGINS:-http://localhost:4200}
      RUNEVAULT_WS_TICKET_SECONDS: ${RUNEVAULT_WS_TICKET_SECONDS:-30}
      RUNEVAULT_WS_MAX_TICKETS: ${RUNEVAULT_WS_MAX_TICKETS:-10000}
      RUNEVAULT_WS_MAX_CONNECTIONS_PER_USER: ${RUNEVAULT_WS_MAX_CONNECTIONS_PER_USER:-3}
      RUNEVAULT_WS_TICKET_ISSUANCE_PER_WINDOW: ${RUNEVAULT_WS_TICKET_ISSUANCE_PER_WINDOW:-30}
      RUNEVAULT_RATE_WINDOW_SECONDS: ${RUNEVAULT_RATE_WINDOW_SECONDS:-60}
      RUNEVAULT_RATE_MAX_ENTRIES: ${RUNEVAULT_RATE_MAX_ENTRIES:-10000}
      RUNEVAULT_DASHBOARD_READS_PER_WINDOW: ${RUNEVAULT_DASHBOARD_READS_PER_WINDOW:-300}
      RUNEVAULT_TRANSACTION_CREATION_PER_WINDOW: ${RUNEVAULT_TRANSACTION_CREATION_PER_WINDOW:-60}
      RUNEVAULT_BRIDGE_AUTHORIZATIONS_PER_WINDOW: ${RUNEVAULT_BRIDGE_AUTHORIZATIONS_PER_WINDOW:-120}
      RUNEVAULT_BRIDGE_OTHER_PER_WINDOW: ${RUNEVAULT_BRIDGE_OTHER_PER_WINDOW:-120}
      RUNEVAULT_ADMIN_OPERATIONS_PER_WINDOW: ${RUNEVAULT_ADMIN_OPERATIONS_PER_WINDOW:-60}
      RUNEVAULT_UNAUTHENTICATED_PER_WINDOW: ${RUNEVAULT_UNAUTHENTICATED_PER_WINDOW:-60}
      RUNEVAULT_DEVICE_SECRET: ${RUNEVAULT_DEVICE_SECRET:?Copy .env.example to .env first}
      RUNEVAULT_PICO_DEVICE_ID: ${RUNEVAULT_PICO_DEVICE_ID:-slab-01}
      RUNEVAULT_PICO_KEY: ${RUNEVAULT_PICO_KEY:-}
      RUNEVAULT_MAX_AMOUNT_MINOR: ${RUNEVAULT_MAX_AMOUNT_MINOR:-100000000}
      RUNEVAULT_ALLOWED_DESTINATIONS: ${RUNEVAULT_ALLOWED_DESTINATIONS:-acct-999,harbor}
      RUNEVAULT_MAX_INCORRECT_GLYPH_ATTEMPTS: ${RUNEVAULT_MAX_INCORRECT_GLYPH_ATTEMPTS:-5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      RUNEVAULT_MIN_TRANSLATION_CONFIDENCE: ${RUNEVAULT_MIN_TRANSLATION_CONFIDENCE:-0.8}
      RUNEVAULT_MAX_RISK_SCORE: ${RUNEVAULT_MAX_RISK_SCORE:-30}
      NESSIE_ENABLED: ${NESSIE_ENABLED:-true}
      NESSIE_API_KEY: ${NESSIE_API_KEY}
      NESSIE_SOURCE_ACCOUNT_ID: ${NESSIE_SOURCE_ACCOUNT_ID}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:4200:80"]
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/login"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  postgres-data:
