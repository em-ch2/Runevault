name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -f backend/pom.xml verify
      - name: Require PostgreSQL migration integration tests
        run: |
          report=backend/target/surefire-reports/com.runevault.PostgresMigrationTest.txt
          test -f "$report"
          grep -q 'Tests run: 2, Failures: 0, Errors: 0, Skipped: 0' "$report"
          bootstrap=backend/target/surefire-reports/com.runevault.PostgresBootstrapSpringTest.txt
          test -f "$bootstrap"
          grep -q 'Tests run: 1, Failures: 0, Errors: 0, Skipped: 0' "$bootstrap"
      - name: Scan Maven dependencies for high-severity vulnerabilities
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          test -n "$NVD_API_KEY" || { echo 'Configure the NVD_API_KEY repository secret for dependency scanning.'; exit 1; }
          mvn -B -f backend/pom.xml org.owasp:dependency-check-maven:13.0.0:check -DfailBuildOnCVSS=7 -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
      - run: node --check bridge/simulator.mjs
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx ng test --watch=false
  cloud-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate cloud Compose and published ports without revealing resolved environment
        run: |
          docker compose --env-file .env.cloud.example -f compose.cloud.yaml config --quiet
          docker compose --env-file .env.cloud.example -f compose.cloud.yaml config --format json |
            jq -e '(.services.backend.ports // []) == [] and (.services.frontend.ports // []) == [] and (.services.caddy.ports | length) == 2' >/dev/null
      - name: Validate Caddy routing syntax
        run: |
          docker run --rm -e RUNEVAULT_DOMAIN=example.invalid \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
