spring.datasource.url=jdbc:h2:mem:runevault;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.flyway.enabled=false
runevault.transaction-policy.allowed-destinations=acct-999,harbor,5a1b0e4e-4f52-4360-9000-000000000002
runevault.auto-execute=false
nessie.enabled=false
# Settlement checks run on a timer; tests call BankReconciliationService directly.
runevault.bank-settlement.enabled=false
