spring.application.name=runevault
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
runevault.pico-device-id=${RUNEVAULT_PICO_DEVICE_ID:slab-01}
runevault.pico-key=${RUNEVAULT_PICO_KEY:}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/runevault}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:runevault}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:local-postgres-only-change-before-deploy}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-postgresql.sql
spring.profiles.default=dev
runevault.device-secret=${RUNEVAULT_DEVICE_SECRET:local-demo-only-change-before-deploy}
runevault.bridge-token=${RUNEVAULT_BRIDGE_TOKEN:local-bridge-only-change-before-deploy}
runevault.rate-limit.window-seconds=${RUNEVAULT_RATE_WINDOW_SECONDS:60}
runevault.rate-limit.max-entries=${RUNEVAULT_RATE_MAX_ENTRIES:10000}
runevault.rate-limit.dashboard-reads=${RUNEVAULT_DASHBOARD_READS_PER_WINDOW:300}
runevault.rate-limit.transaction-creation=${RUNEVAULT_TRANSACTION_CREATION_PER_WINDOW:60}
runevault.rate-limit.bridge-authorization=${RUNEVAULT_BRIDGE_AUTHORIZATIONS_PER_WINDOW:120}
runevault.rate-limit.bridge-other=${RUNEVAULT_BRIDGE_OTHER_PER_WINDOW:120}
runevault.rate-limit.admin-operations=${RUNEVAULT_ADMIN_OPERATIONS_PER_WINDOW:60}
runevault.rate-limit.unauthenticated=${RUNEVAULT_UNAUTHENTICATED_PER_WINDOW:60}
runevault.transaction-policy.max-amount-minor=${RUNEVAULT_MAX_AMOUNT_MINOR:100000000}
runevault.transaction-policy.allowed-destinations=${RUNEVAULT_ALLOWED_DESTINATIONS:acct-999,harbor}
runevault.transaction-policy.max-incorrect-glyph-attempts=${RUNEVAULT_MAX_INCORRECT_GLYPH_ATTEMPTS:5}
runevault.gemini.api-key=${GEMINI_API_KEY:}
runevault.gemini.model=gemini-3.1-flash-lite
runevault.gemini.minimum-translation-confidence=${RUNEVAULT_MIN_TRANSLATION_CONFIDENCE:0.8}
runevault.gemini.maximum-risk-score=${RUNEVAULT_MAX_RISK_SCORE:30}
nessie.enabled=${NESSIE_ENABLED:true}
nessie.api-key=${NESSIE_API_KEY:}
nessie.base-url=https://prod-api.nessieisreal.com
nessie.source-account-id=${NESSIE_SOURCE_ACCOUNT_ID:}
