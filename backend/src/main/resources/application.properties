spring.application.name=runevault
runevault.ai.provider=${RUNEVAULT_AI_PROVIDER:mock}
runevault.gemini.api-key=${GEMINI_API_KEY:}
runevault.gemini.model=${GEMINI_MODEL:}
runevault.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:15}
runevault.pico-device-id=${RUNEVAULT_PICO_DEVICE_ID:slab-01}
runevault.pico-key=${RUNEVAULT_PICO_KEY:}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/runevault}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:runevault}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:local-postgres-only-change-before-deploy}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-postgresql.sql
spring.profiles.default=dev
runevault.mode=${RUNEVAULT_MODE:local}
runevault.device-secret=${RUNEVAULT_DEVICE_SECRET:local-demo-only-change-before-deploy}
runevault.bridge-token=${RUNEVAULT_BRIDGE_TOKEN:local-bridge-only-change-before-deploy}
runevault.requests-per-minute=${RUNEVAULT_REQUESTS_PER_MINUTE:120}
